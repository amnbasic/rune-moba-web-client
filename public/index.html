<!doctype html>
<html>
    <head>
        <title>Client-TS</title>

        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=0.7" />

        <style>
            html {
                touch-action: manipulation;
            }

            body,
            td,
            p {
                font-family: Arial, Helvetica, sans-serif;
                font-size: 12px;
                color: white;
            }

            body {
                margin: 0px 0px;
                overflow: auto;
                background-color: black;
            }

            #game {
                padding-left: 0;
                padding-right: 0;
                margin-left: auto;
                margin-right: auto;
                display: block;
                position: relative; /* stacking context for the GL scene canvas below the 2D canvas */
                width: fit-content;
            }

            #glcanvas {
                position: absolute;
                left: 0;
                top: 0;
                z-index: 0;
            }

            #canvas {
                position: relative;
                z-index: 1;
                background: transparent;
            }

            /* ::settings fullscreen: the CONTAINER goes fullscreen so both canvases show. */
            #game:fullscreen {
                background-color: black;
                width: 100vw;
                height: 100vh;
            }

            canvas {
                display: block;
                /* touch-action: none; */
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                -khtml-user-select: none;
                -moz-user-select: none;
                -ms-user-select: none;
                user-select: none;
                outline: none;
                -webkit-tap-highlight-color: rgba(255, 255, 255, 0);
                z-index: -1;
                image-rendering: pixelated;
            }

            html:-webkit-full-screen {
                background-color: black !important;
            }

            /* ::fs fullscreen: letterbox the 765x503 bitmap to the screen (aspect-fit).
               ClientMouseListener's fullscreen coordinate math assumes exactly this. */
            canvas:fullscreen {
                width: 100vw;
                height: 100vh;
                object-fit: contain;
                background-color: black;
            }
        </style>
    </head>

    <body>
        <center>
            <div id="game">
                <canvas id="glcanvas"></canvas>
                <canvas id="canvas"> Your browser is not capable of running our web client. </canvas>
            </div>
        </center>

        <!-- DEV console streamer: mirrors console + uncaught errors + promise rejections to the
             dev server (-> web-client/dbg.log). NO on-page overlay — invisible. -->
        <script>
            (function () {
                function fmt(a) {
                    try {
                        if (a && a.stack) return String(a.stack);
                        if (typeof a === 'object') return JSON.stringify(a);
                        return String(a);
                    } catch (e) { return '<?>'; }
                }
                function push(tag, args) {
                    var text = tag + ' ' + Array.prototype.map.call(args, fmt).join(' ');
                    // sendBeacon per line: survives a hard-blocked event loop (sync infinite loop).
                    try { navigator.sendBeacon('/dbg', text + '\n'); } catch (e) {}
                }
                ['log', 'warn', 'error'].forEach(function (k) {
                    var o = console[k].bind(console);
                    console[k] = function () { push(k.toUpperCase(), arguments); o.apply(console, arguments); };
                });
                window.addEventListener('error', function (e) { push('UNCAUGHT', [e.message + ' @ ' + e.filename + ':' + e.lineno]); });
                window.addEventListener('unhandledrejection', function (e) { push('REJECT', [(e.reason && e.reason.stack) || e.reason]); });
                push('DBG', ['==== SESSION ' + new Date().toISOString() + ' ====']);
            })();
        </script>
        <script type="module">
            import { Client } from './client/client.js';

            (() => {
                new Client();
            })();
        </script>
    </body>
</html>
